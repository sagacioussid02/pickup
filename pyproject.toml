[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickup-cli"
version = "0.1.0"
description = "\"Where was I?\" for all your repos in one command."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Siddharth Shankar" }]
keywords = ["git", "cli", "developer-tools", "productivity"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
pickup = "pickup.cli:main"

[project.urls]
Homepage = "https://github.com/sagacioussid02/pickup"

[tool.hatch.build.targets.wheel]
packages = ["src/pickup"]
